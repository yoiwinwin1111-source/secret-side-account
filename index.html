function composeHTML(){const platform=tab,opts=available(platform);if(!opts.length&&R.phase<7)return head('发布动态')+'<div class="pad"><p>这阶段的动态已经发完了。</p><button class="primary" data-go="story">继续故事</button></div>';activeEpisode=opts.some(([k])=>k===activeEpisode)?activeEpisode:opts[0]?.[0]||'free';const episode=EPISODES[activeEpisode];const branchPost=activeEpisode==='v5-photo'?USER_V5.posts.find(p=>p.branch==='earphone_case'):null;return head(platform==='ig'?'发布日常':'发布帖子')+'<form class="pad" id="postForm"><div class="row">'+avatar(platform==='ig'?'alt':'x')+'<b>'+esc(R.accounts[platform==='ig'?'alt':'x'].name)+'</b></div><div class="formrow"><label>这次更新</label><select name="kind">'+opts.map(([k,x])=>'<option value="'+k+'" '+(k===activeEpisode?'selected':'')+'>'+esc(x.title)+'</option>').join('')+(R.phase===7?'<option value="free" '+(activeEpisode==='free'?'selected':'')+'>自由日常</option>':'')+'</select></div>'+(platform==='ig'?'<div class="formrow"><label>照片里的物品</label><select name="itemId" aria-label="照片里的物品">'+Object.entries(ITEMS).filter(([k])=>activeEpisode!=='v5-photo'||['earphone_case','coffee','mouse'].includes(k)).map(([k,x])=>'<option value="'+k+'" '+(k===(episode?.item||'earphone_case')?'selected':'')+'>'+x.name+'</option>').join('')+'</select></div><div class="formrow"><label>日常照片</label><input id="postImage" type="file" accept="image/*"><div id="postPreview"></div></div>':'')+'<div class="formrow"><label>这条的表达方式</label><select name="stance" aria-label="这条的表达方式"><option value="free">原稿 / 自由表达</option><option value="a">偏向 '+esc(R.a)+' 唯粉</option><option value="b">偏向 '+esc(R.b)+' 唯粉</option><option value="cp">偏向 '+esc(R.a+R.b)+' CP粉</option><option value="group">普通团粉</option></select></div><div class="formrow"><label>正文</label><textarea name="body" aria-label="帖子正文" required maxlength="1800">'+esc(txt(branchPost?.body||episode?.body||(platform==='x'?'':ITEMS[episode?.item||'earphone_case'].body)))+'</textarea></div><div class="formrow"><label>可见范围</label><sele function publishPost(platform,body,kind,scope,itemId,image,expression={}){const ep=EPISODES[kind];if(ep?.guided&&scope!=='public'){toast('这条剧情动态需要公开，才能继续评论互动。');return null}if(ep?.guided&&nextStoryAction()?.key!==kind){toast('先完成前面的聊天或动态。');return null}if(kind!=='free'&&(!ep||ep.platform!==platform||R.phase<ep.phase||R.posts.some(p=>p.own&&p.kind===kind))){toast('该事件尚未解锁，或已经发布。');return null}if(kind==='free'&&R.phase<7)return null;if(!body.trim())return null;itemId=platform==='ig'&&ITEMS[itemId]?itemId:'generic';const rollback=JSON.stringify(R),id='p:'+Date.now()+':'+Math.random().toString(36).slice(2,8),p={id,platform,own:true,kind,scope,itemId,prop:ITEMS[itemId].name,body:body.trim(),image:image||'',at:Date.now(),storyAt:tickTime(),phase:R.phase,likes:0,commentSchema:9,stance:expression.stance||'free',stanceEvidence:expression.evidence||null};p.scriptPostId=kind==='v5-photo'?USER_V5.posts.find(q=>q.branch===itemId)?.id:ep?.scriptPostId;if(kind==='v5-photo')R.storyItemId=itemId;if(p.scriptPostId){const src=USER_V5.posts.find(q=>q.id===p.scriptPostId),parts=(src?.time||'18:00').split(':');if(src){p.storyAt=Math.max(R.storyEpoch+(src.day-1)*86400000+Number(parts[0])*3600000+Number(parts[1])*60000,(R.lastAuthoredAt||0)+60000);R.lastAuthoredAt=p.storyAt}}R.posts.unshift(p);R.comments[id]=[];if(scope==='public')R.events.push({id,kind,step:0,due:Date.now()+1800});if(!save()){R=JSON.parse(rollback);return null}seedEcologyHistory();seedUserWorld(R.phase);go(platform);toast(scope==='private'?'已保存，仅自己可见':'已发布');return p}

function eventTick(){let changed=false;for(const ev of R.events){if(ev.step>=3||ev.due>Date.now())continue;const p=R.posts.find(p=>p.id===ev.id);if(!p){ev.step=3;continue}if(p.scope!=='public'){ev.step=3;continue}const step=ev.step;ev.step++;ev.due=Date.now()+(step===0?6500:10000);changed=true;if(step===0){const cs=p.scriptPostId?userCommentsFor(p):generatedComments(p,0,6);const ids=new Set((R.comments[p.id]||[]).map(c=>c.id));R.comments[p.id]??=[];R.comments[p.id].push(...cs.filter(c=>!ids.has(c.id)));if(p.scriptPostId){seedFanMemories(p);const ecology=stanceFanComments(p);R.comments[p.id].push(...ecology.filter(c=>!R.comments[p.id].some(x=>x.id===c.id)))}p.likes=(p.likes||0)+11+R.phase*3;notify(p.platform==='ig'?'Instagram':'X','你的动态有新评论',p.platform,p.id)}if(step===1){const cs=p.scriptPostId?[]:generatedComments(p,6,4);const ids=new Set(R.comments[p.id].map(c=>c.id));R.comments[p.id].push(...cs.filter(c=>!ids.has(c.id)));discussionBodies(p).forEach((body,i)=>{const id=p.id+':discussion:'+i;if(R.posts.some(x=>x.id===id))return;const role=['cp','group','a','b'][i],q={id,platform:'x',handle:fanHandle(role,i+R.phase),role,body,kind:p.kind,itemId:p.itemId,phase:p.phase,source:p.id,angle:i,at:Date.now(),storyAt:p.storyAt+(i+5)*60000,likes:6+i*7+R.phase*2,commentSchema:9};R.posts.unshift(q);R.comments[id]=generatedComments(q,16+i*5,5)});notify('X','有人引用了你的动态，查看完整讨论','x',p.id+':discussion:0')}if(step===2){const existing=new Set(R.comments[p.id].map(c=>c.id));R.comments[p.id].push(...(p.scriptPostId?[]:generatedComments(p,10,2)).filter(c=>!existing.has(c.id)));/* Chapter conversations, not unrelated automatic replies, carry this event forward. */}}if(changed){save();if(view==='chat')syncChat();else if(['x','ig','thread','home','lock'].includes(view)&&!document.activeElement?.matches('input,textarea,select')){const pos=E('app').scrollTop;render();E('app').scrollTop=pos}}}

function publicPostHistory(){return R.posts.filter(p=>p.own&&p.scope==='public'&&p.phase<=R.phase&&!p.source).slice().sort((a,b)=>(a.storyAt||a.at)-(b.storyAt||b.at))}
function historyAnalysisBody(){const history=publicPostHistory();if(!history.length)return {body:'先把公开原帖看完，再讨论这个号的偏好。现在没有足够记录，不替号主定粉籍。',ids:[],targets:[]};const chosen=history.slice(-4),targets=[...new Set(chosen.flatMap(nameEvidence))],lines=chosen.map(p=>'第 '+(Math.floor(((p.storyAt||p.at)-R.storyEpoch)/86400000)+1)+' 天，她写：“'+txt(p.body).replace(/\n/g,' ').slice(0,72)+'”');let conclusion=targets.includes('a')&&targets.includes('b')?'这几条里两个人都出现了，我觉得她也可能是CP粉。但这只是看帖的猜测。':targets.length===1?'至少我看到的这些明确提到了'+(targets[0]==='a'?R.a:R.b)+'。其他没写明的部分就先不替她猜。':'这些记录没有明确说谁更多，别只凭语气替她选阵营。';return {body:'我回看了这个号真正发过的几条公开动态：\n'+lines.join('\n')+'\n'+conclusion,ids:chosen.map(p=>p.id),targets}}
function authoredStanceCaption(base,stance,kind){if(stance==='free')return base;let line;if(kind===USER_V5.posts.find(p=>p.phase===2&&p.author==='player')?.id){line=stance==='a'?'也希望讨论{a}的工作时，大家先看完整的公开内容。':stance==='b'?'这次想认真替{b}把前后文说明白。':stance==='cp'?'两个人的工作都值得认真看完，不想拿他们互相比较。':'有原片就按原片聊，先不把这件事变成站队。'}else line=stance==='a'?'今天还想单独夸夸{a}，喜欢他认真工作的样子。':stance==='b'?'今天还想单独夸夸{b}，喜欢他认真工作的样子。':stance==='cp'?'也想把他们公开互动里让我开心的小细节一起记下来。':'大家都按自己的节奏喜欢就好。';return base+'\n\n'+txt(line)}
function stanceFanComments(p){const history=publicPostHistory().filter(x=>x.id!==p.id),priorA=history.find(p=>nameEvidence(p).includes('a')),priorB=history.find(p=>nameEvidence(p).includes('b')),targets=nameEvidence(p),t=targets.join(','),rows=[];const aText=targets.includes('b')&&!targets.includes('a')?(priorA?'之前那条你也认真夸过{a}，这次又在聊{b}。我先不替你认粉籍。':'这条写{b}写得挺认真。我主要看{a}，但也不替博主规定只能夸谁。'):targets.includes('a')?'这次看到你认真夸{a}，想一起把这段工作看完。':'我主要喜欢{a}，这条就按正文看，不拿生活记录考试。';

function markFeedRedundancy(){const reports=new Map(),rediscoveries=new Map();for(const p of R.posts)delete p.feedHiddenBy;const sorted=R.posts.filter(p=>!p.own).sort((a,b)=>Number(b.kind==='user-world')-Number(a.kind==='user-world')||timeBase(a)-timeBase(b));for(const p of sorted){if(isHistoryReport(p)){const ids=historyRefs(p).map(q=>q.id).sort(),role=persona(p.handle).role,perspective=['a','b'].includes(role)?role:'archive';if(ids.length<2)continue;const key=perspective+'|'+ids.join('|');const kept=reports.get(key);if(kept)p.feedHiddenBy=kept.id;else reports.set(key,p)}else if(p.kind==='rediscovery'&&p.source){const key=p.source+'|'+p.handle,kept=rediscoveries.get(key);if(kept)p.feedHiddenBy=kept.id;else rediscoveries.set(key,p)}}}
