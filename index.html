function setup(){return head('账号与角色')+`<form id="setup" class="pad"><p>同团、秘密恋爱。你是 A，B 还不知道这个小号是你。</p><div class="formrow"><label>A 的称呼</label><input aria-label="A 的称呼" name="a" value="${esc(S.a)}" required maxlength="20"></div><div class="formrow"><label>B 的称呼</label><input aria-label="B 的称呼" name="b" value="${esc(S.b)}" required maxlength="20"></div><div class="formrow"><label>组合名称</label><input aria-label="组合名称" name="group" value="${esc(S.group)}" maxlength="30"></div>${Object.entries(S.accounts).map(([k,a])=>`<section class="accounts"><h3>${{a:'A 大号 · Instagram',b:'B 大号 · Instagram',alt:'A 小号 · Instagram',x:'A 小号 · X'}[k]}</h3><div class="accountedit"><label>${avatar(k)}<input type="file" data-avatar="${k}" accept="image/*" aria-label="更换${k}头像"></label><div><input name="${k}name" aria-label="${k}昵称" value="${esc(a.name)}" required maxlength="30"><input name="${k}handle" aria-label="${k}用户名" value="${esc(a.handle)}" required pattern="${k==='x'?'[A-Za-z0-9_]{1,15}':'[A-Za-z0-9_.]{1,30}'}"></div></div></section>`).join('')}<p class="muted">头像和存档仅保存在当前浏览器。上传照片不会发到真实社交平台。</p><button class="primary">保存并进入手机</button><p><small>所有帖子、评论、私聊均为虚构模拟。请使用有权使用的图片。</small></p></form>`}
function social(platform){const ig=platform==='ig',list=S.posts.filter(p=>p.platform===platform&&(p.scope!=='private'||p.own));let body='';if(tab==='profile')body=`<div class="pad"><div class="row">${avatar(ig?'alt':'x')}<div class="profilecounts"><div><b>${list.filter(x=>x.own).length}</b>帖子</div><div><b>${S.fans.toLocaleString()}</b>粉丝</div><div><b>${28+S.following.length}</b>关注</div></div></div><h2>${esc(S.accounts[ig?'alt':'x'].name)}</h2><p>@${esc(S.accounts[ig?'alt':'x'].handle)}</p><p class="muted">慢慢看，慢慢喜欢。</p><button class="secondary" data-go="setup">编辑个人资料</button></div>`+list.filter(p=>p.own).map(postHTML).join('');else if(tab==='notice')body=S.notifications.filter(n=>n.app===(ig?'Instagram':'X')).map(n=>`<button class="post" style="width:100%;text-align:left" ${n.post?'data-open="'+n.post+'"':'data-go="x"'}>${esc(n.text)}</button>`).join('')||'<div class="empty">暂时没有新通知</div>';else if(tab==='search')body='<div class="pad"><input id="search" placeholder="搜索帖子、用户名" aria-label="搜索"><p class="muted">'+esc(S.a+' · '+S.b+' · 同款 · 舞台 · 小号')+'</p></div><div id="results">'+list.map(postHTML).join('')+'</div>';else body=(ig?`<div class="storyrings">${['alt','a','b'].map(k=>`<button data-account="${k}">${avatar(k)}${esc(S.accounts[k].handle)}</button>`).join('')}</div>`:'<div class="tabs"><button class="active">为你推荐</button><button data-tab="profile">我的帖子</button></div>')+(list.length?list.map(postHTML).join(''):'<div class="pad"><p>发一张日常照片，让这个小号慢慢有自己的生活。</p><button class="primary" data-compose="ig">发布第一条日常</button></div>');return head(ig?'Instagram':'𝕏')+body+nav(platform)+`<button class="fab" data-compose="${platform}" aria-label="发布${platform}帖子">＋</button>`}
function render(){E('close').hidden=['home','lock','setup'].includes(view);let h='';if(view==='setup')h=setup();if(view==='lock')h=`<div class="lock"><div>${new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'})}</div><div class="clock" id="locktime">${clock()}</div>${S.notifications.filter(x=>!x.read).slice(0,3).map(n=>`<button class="widget" data-go="${n.target==='thread'?'x':n.target}">${esc(n.app+' · '+n.text)}</button>`).join('')}<button class="primary" data-go="home">向上轻扫解锁</button></div>`;if(view==='home')h=`<div class="wall"><button class="widget" data-go="story"><small>小号正在输入 · ${S.phase+1}/8</small><strong>${chapters[S.phase][0]}</strong><span>继续今天的故事 →</span></button><div class="grid">${[['chat','KakaoTalk','chat'],['x','X','x'],['ig','Instagram','ig'],['setup','设置','gear'],['story','故事','note'],['lock','锁屏','phone']].map(([v,n,k])=>`<button class="appbtn" data-go="${v}"><span class="ico" style="background:${{chat:'#ffe500',x:'#000',ig:'radial-gradient(at 20% 100%,#ffda55,#ff2369,#9f2be8)',gear:'#919199',note:'#f7f7fa',phone:'#27da52'}[k]}"><svg viewBox="0 0 32 32" aria-hidden="true">${MARKS[k]||''}</svg></span>${n}</button>`).join('')}</div></div>`;if(['x','ig'].includes(view))h=social(view);if(view==='thread'){let p=S.posts.find(x=>x.id===selected);h=head('讨论串')+(p?postHTML(p)+(p.source?'<button class="secondary" data-open="'+p.source+'">查看被讨论的原动态 →</button>':'')+(S.comments[p.id]||[]).map((c,i)=>`<div class="comment"><div class="handle">@${esc(c.handle)} · ${esc(c.type||'回复')}</div>${esc(c.text)}<div class="actions"><span>♡ ${c.likes||0}</span><button data-reply="${c.handle}">回复</button></div>${(c.replies||[]).map(r=>'<div class="reply"><span class="handle">@'+esc(r.handle)+'</span><br>'+esc(r.text)+'</div>').join('')}</div>`).join('')+`<form id="reply" class="composebar"><input id="replytext" aria-label="发表评论" placeholder="发表你的回复…" required maxlength="600"><button>发送</button></form>`:'<div class="empty">帖子不存在</div>')}
if(view==='compose')h=head('发布'+(tab==='ig'?'日常':'帖子'))+`<form id="publish" class="pad"><div class="row">${avatar(tab==='ig'?'alt':'x')}<b>${esc(S.accounts[tab==='ig'?'alt':'x'].name)}</b></div><div class="formrow"><textarea name="body" placeholder="这一刻，想说些什么？" required maxlength="1800"></textarea></div>${tab==='ig'?'<div class="formrow"><label>日常照片（可选；未上传时使用示意图）</label><input type="file" id="postimage" accept="image/*"><div id="imagepreview"></div></div>':''}<div class="formrow"><label>这次动态的内容</label><select name="kind"><option value="daily">普通日常，不触发同款争议</option><option value="match">晒自己的物品，被认出 A 同款</option><option value="defend">维护 B，纠正公开内容的误传</option></select></div><div class="formrow"><label>照片里的物品</label><select name="prop"><option>耳机壳</option><option>帽子</option><option>衣服一角</option><option>咖啡与日常</option></select></div><div class="formrow"><label>可见范围</label><select name="scope"><option value="public">公开</option><option value="private">仅自己可见</option></select></div><button class="primary">发布</button><p class="muted">公开的关键动态会引来评论和独立讨论；私密动态不会被外部账号看见。</p></form>`;
if(view==='official'){const a=S.accounts[official];h=head(a.name)+'<div class="pad"><div class="row">'+avatar(official)+'<div class="profilecounts"><div><b>126</b>帖子</div><div><b>86.4万</b>粉丝</div><div><b>24</b>关注</div></div></div><h2>'+esc(a.name)+'</h2><p>@'+esc(a.handle)+'</p><p>'+esc(S.group)+' · Official</p><button class="primary" data-follow="'+official+'">'+(S.following.includes(official)?'已关注':'关注')+'</button><p class="muted">公开工作与生活记录</p>'+['练习结束，今天也辛苦了。','谢谢今天来到现场的大家。','路上的天空。'].map((t,i)=>'<div class="card"><div class="placeholder"><span>'+['练习室一角','舞台灯光','傍晚天空'][i]+'</span></div><p>'+t+'</p></div>').join('')+'</div>'}if(view==='chat')h=head(S.b)+`<div class="pad"><div class="muted" style="text-align:center;font-size:12px">今天 · 私人聊天</div><div class="message">练习结束了吗？等你一起回去。</div>${S.chats.map(m=>'<div class="message '+(m.from==='me'?'me':'')+'">'+esc(text(m.text))+'</div>').join('')}<div class="card"><small>${S.phase>=7?'B 已知道小号是你，网友尚不知情。':'B 还不知道你的小号。'}</small><button class="secondary" data-go="story">继续故事</button></div></div><form id="chat" class="composebar"><input name="body" required aria-label="输入聊天消息" placeholder="输入一条信息" maxlength="600"><button>发送</button></form>`;
if(view==='story'){let [title,prose,choice]=chapters[S.phase];h=head('小号手记')+`<div class="pad"><small>第 ${S.phase+1} 天 · ${esc(S.group)}</small><h2>${title}</h2><p class="scene">${esc(text(prose))}</p><div class="card">${S.phase===1?'去 Instagram 发一条自己的同款日常。':S.phase===2?'去 X 维护 B，也可以先看别人怎么讨论。':S.phase===6?'这是两人私下的坦白，不会触发公开掉马。':'逛逛信息流，看看这个小号今天遇见了谁。'}</div><button class="primary" data-do="chapter">${esc(text(choice))}</button><p><button class="secondary" data-go="x">先去 X 看看</button></p></div>`}E('app').innerHTML=h;bind()}
function clock(){return new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false})}setInterval(()=>{E('time').textContent=clock();if(E('locktime'))E('locktime').textContent=clock();eventTick()},1000);E('time').textContent=clock();
function bind(){E('app').onclick=e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.go)go(d.go);if(d.tab){tab=d.tab;render()}if(d.open){selected=d.open;go('thread')}if(d.compose){view='compose';tab=d.compose;draftImage='';render()}if(d.like){let i=S.likes.indexOf(d.like);i<0?S.likes.push(d.like):S.likes.splice(i,1);save();b.classList.toggle('liked');let p=S.posts.find(p=>p.id===d.like);b.textContent='♡ '+(p.likes+(i<0?1:0))}if(d.follow){let i=S.following.indexOf(d.follow);i<0?S.following.push(d.follow):S.following.splice(i,1);save();b.textContent=i<0?'已关注':'关注'}if(d.book){let i=S.bookmarks.indexOf(d.book);i<0?S.bookmarks.push(d.book):S.bookmarks.splice(i,1);save();b.textContent=i<0?'已收藏':'收藏'}if(d.quote){let p=S.posts.find(p=>p.id===d.quote);view='compose';tab='x';render();E('publish').elements.body.value='引用 @'+(p.own?S.accounts[p.platform==='ig'?'alt':'x'].handle:p.handle)+'：'+p.body+'\n\n'}if(d.reply){E('replytext').value='@'+d.reply+' ';E('replytext').focus()}if(d.account){official=d.account;if(official==='alt'){tab='profile';render()}else go('official')}if(d.do==='back')go(view==='thread'?'x':'home');if(d.do==='chapter'){let n=S.phase;if(n===1||n===2){S.phase++;save();view='compose';tab=n===1?'ig':'x';render();E('publish').elements.kind.value=n===1?'match':'defend';return}if(n<7)S.phase++;S.chats.push({from:'b',text:n===6?'早该想到是你。你在那个账号里，比当着我的面还会夸我。':'今天辛苦了。你刚才看着手机笑什么？'});save();go(n===6?'chat':'home')}};
if(E('setup')){E('setup').onsubmit=e=>{e.preventDefault();const f=e.target.elements;S.a=f.a.value.trim();S.b=f.b.value.trim();S.group=f.group.value.trim();for(const k of Object.keys(S.accounts)){S.accounts[k].name=f[k+'name'].value.trim();S.accounts[k].handle=f[k+'handle'].value.trim()}if(!S.a||!S.b){toast('请填写角色称呼');return}S.ready=true;if(!save())return;seedPosts();go('home')};document.querySelectorAll('[data-avatar]').forEach(i=>i.onchange=async()=>{if(!i.files[0])return;try{S.accounts[i.dataset.avatar].avatar=await photo(i.files[0]);save();toast('头像已选好，保存资料即可。')}catch{toast('无法读取图片，请换一张。')}})}
if(E('publish'))E('publish').onsubmit=e=>{e.preventDefault();const f=e.target.elements;publish(tab,f.body.value.trim(),f.kind.value,f.scope.value,f.prop.value,draftImage)};if(E('postimage'))E('postimage').onchange=async e=>{try{draftImage=await photo(e.target.files[0]);E('imagepreview').innerHTML='<img class="photo" src="'+draftImage+'" alt="照片预览">'}catch{toast('无法读取图片')}};
if(E('reply'))E('reply').onsubmit=e=>{e.preventDefault();let value=E('replytext').value.trim();if(!value)return;S.comments[selected].push({id:'r'+Date.now(),handle:S.accounts.x.handle,text:value,likes:0,replies:[]});save();render();const id=selected;setTimeout(()=>{if(!S.posts.some(p=>p.id===id))return;S.comments[id].push({id:'r'+Date.now(),handle:'softsignal_6',text:'看到你的回复了。可以观点不同，先别上升到人。',likes:4,replies:[]});save();notify('X','有人回复了你的评论','thread',id)},4500)};
if(E('chat'))E('chat').onsubmit=e=>{e.preventDefault();let value=e.target.elements.body.value.trim();if(!value)return;S.chats.push({from:'me',text:value});save();render();setTimeout(()=>{S.chats.push({from:'b',text:S.phase>=7?'你又去那个号里看评论了？过来，我就在这里。':'好。先不看手机了，陪我待一会儿。'});save();if(view==='chat'&&!document.activeElement?.matches('input'))render();else notify('KakaoTalk',S.b+'回复了你','chat')},1800)};
if(E('search'))E('search').oninput=e=>{const q=e.target.value.toLowerCase();E('results').innerHTML=S.posts.filter(p=>p.platform===view&&(p.body+' '+p.handle).toLowerCase().includes(q)).map(postHTML).join('')}}
async function photo(file){if(!file||!file.type.startsWith('image/'))throw Error();return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{let i=new Image;i.onerror=no;i.onload=()=>{const c=document.createElement('canvas'),scale=Math.min(1,900/Math.max(i.width,i.height));c.width=i.width*scale;c.height=i.height*scale;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.76))};i.src=r.result};r.readAsDataURL(file)})}
