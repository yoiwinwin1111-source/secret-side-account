const baseMakeComments=makeComments;makeComments=function(kind,seed=0){const bank=EXTRA_COMMENTS[kind];if(!bank)return baseMakeComments(kind,seed);return Array.from({length:bank.length*2},(_,i)=>({id:'extra'+seed+'_'+i,handle:handles[(i+seed)%handles.length],type:types[(i+seed)%types.length],text:text(bank[i%bank.length][i<bank.length?0:1]),likes:5+(i*13+seed)%120,replies:i%3===0?[{handle:handles[(i+9)%24],text:text(bank[i%bank.length][1])}]:[]}))};
function extraDiscussionBodies(kind,p){const x=EXTRA_SCENES[kind];if(!x)return null;return ({ad:['那个小号晒了{a}的代言，评论又在说只支持一个人。','购物清单不是喜欢谁的投票，别拿消费额分粉籍。','他维护{b}的旧帖还在，这次又被说偏{a}，看得我迷惑。','有人真在问产品好不好用，能不能给日常分享留点空间。'],gift:['小号发了选礼物的照片，评论已经猜了好几个收礼物的人。','别因为时间接近{b}生日就把别人的礼物按头认领。','我只关心这个号最后选深色还是浅色，蹲后续。','博主有重要的人也很正常，不等于嗑CP是演的。'],takeout:['那个号的两份外卖引发了新的阅读理解。','今天连博主和饭搭子都有人嗑了，评论区太热闹。','有人说店和{a}推荐的一样，连锁店也能当线索吗。','两个人吃饭可以有很多关系，不用盯着另一个人的身份。'],selfcrit:['小号评价{a}舞台那条，原文和搬运版本完全不是一个意思。','{a}粉觉得被挑刺，CP粉觉得要求太严，讨论又歪了。','别把{b}拉进来，复盘一个舞台不需要比较两个人。','可以讨论转身，也别把那场后半段做得好的地方全忽略。']})[kind].map(text)}
const extraEventTalk=receiveEventMessage;receiveEventMessage=function(ev){const x=EXTRA_SCENES[ev.kind];if(!x)return extraEventTalk(ev);return addTalk('b',text(x.b),'event:'+ev.id)};
const extraReplyChoices=contextualTalkChoices;contextualTalkChoices=function(){const last=S.chats.at(-1);if(last?.from==='b'){if(last.text.includes('自己下的单'))return ['下次我给你留一份。','谢谢支持，认真用完再告诉我感受。'];if(last.text.includes('挑东西'))return ['那你先别猜，等生日。','深色和浅色你更喜欢哪个？'];if(last.text.includes('换我点'))return ['好，下次你点。','电影也一起选吧。'];if(last.text.includes('别只盯着失误'))return ['你连后半段都认真看了。','我会继续练，也会记得自己做得好的地方。']}return extraReplyChoices()};
const extraRender=render;render=function(){extraRender();if(view==='compose'){const f=E('publish');if(f){const opts=tab==='ig'?['ad','gift','takeout']:['selfcrit'];opts.filter(k=>S.phase>=EXTRA_SCENES[k].unlock).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=EXTRA_SCENES[k].title;f.elements.kind.appendChild(o)});f.elements.kind.onchange=()=>{const x=EXTRA_SCENES[f.elements.kind.value];if(x&&f.elements.prop){const o=document.createElement('option');o.value=x.prop;o.textContent=x.prop;f.elements.prop.appendChild(o);f.elements.prop.value=x.prop}}}}if(view==='story'){const root=E('app').querySelector('.pad');if(root&&S.phase>=1){root.insertAdjacentHTML('beforeend','<div class="card"><h3>这几天的小事</h3>'+Object.entries(EXTRA_SCENES).filter(([k,x])=>S.phase>=x.unlock).map(([k,x])=>'<button class="secondary" style="width:100%;margin:5px 0;text-align:left" data-extra="'+k+'">'+x.title+'　›</button>').join('')+'</div>');root.querySelectorAll('[data-extra]').forEach(b=>b.onclick=()=>{S.extraScene=b.dataset.extra;save();go('extraScene')})}}if(view==='extraScene'){const x=EXTRA_SCENES[S.extraScene];if(!x){go('story');return}E('app').innerHTML=head(x.title)+'<div class="pad"><small>生活片段</small><h2>'+x.title+'</h2><p class="scene">'+esc(text(x.intro))+'</p><button class="primary" id="openExtraPost">打开 '+(x.platform==='ig'?'Instagram 晒日常':'X 写下想法')+'</button><p><button class="secondary" data-go="story">先不发布</button></p></div>';bind();E('openExtraPost').onclick=()=>{view='compose';tab=x.platform;draftImage='';render();const f=E('publish');f.elements.body.value=text(x.body);f.elements.kind.value=S.extraScene;if(f.elements.prop){const o=document.createElement('option');o.value=x.prop;o.textContent=x.prop;f.elements.prop.appendChild(o);f.elements.prop.value=x.prop}}}};
